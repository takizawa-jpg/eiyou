<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>パズル＆せいちょう！ 3しょくパクモン</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background-color: #f0fdf4;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      color: #1e293b;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      margin: 5px 0 10px 0;
      color: #059669;
    }

    /* キャラクターエリア */
    .char-card {
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
      border: 3px solid #86efac;
    }

    .speech-bubble {
      position: absolute;
      top: -10px;
      right: 15px;
      background: #fef08a;
      border: 2px solid #eab308;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      color: #854d0e;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .char-avatar {
      font-size: 70px;
      margin: 5px 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .char-avatar.grow {
      transform: scale(1.3) rotate(5deg);
    }

    .char-info {
      font-weight: bold;
      font-size: 16px;
      color: #0f172a;
    }

    /* 成長ゲージ */
    .gauge-container {
      background: #e2e8f0;
      border-radius: 10px;
      height: 16px;
      width: 100%;
      margin: 8px 0;
      overflow: hidden;
    }
    .gauge-fill {
      background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%);
      height: 100%;
      width: 0%;
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    /* 栄養メーター（赤・黄・緑） */
    .nutrition-status {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .nut-badge {
      padding: 3px 8px;
      border-radius: 8px;
      color: white;
    }
    .nut-red { background: #ef4444; }
    .nut-yellow { background: #eab308; }
    .nut-green { background: #22c55e; }

    /* パズルエリア */
    .puzzle-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    .block {
      aspect-ratio: 1;
      background: white;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 3px solid transparent;
      transition: transform 0.1s, border-color 0.2s;
    }
    .block:active {
      transform: scale(0.9);
    }
    .block.selected {
      border-color: #3b82f6;
      background-color: #eff6ff;
      transform: scale(1.05);
    }
    .block-name {
      font-size: 10px;
      font-weight: bold;
      color: #475569;
      margin-top: -2px;
    }

    /* 操作・スコア */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .score-box {
      font-size: 18px;
      font-weight: bold;
      color: #047857;
    }
    .btn {
      font-size: 16px;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 50px;
      border: none;
      background: #059669;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn:active { transform: scale(0.95); }

    /* ルール説明テキスト */
    .rule-tip {
      font-size: 12px;
      color: #64748b;
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>3しょくパクモン パズル</h1>

    <!-- キャラクター表示エリア -->
    <div class="char-card">
      <div class="speech-bubble" id="speech">あか・きいろ・みどり を えらんでね！</div>
      <div class="char-avatar" id="avatar">👶</div>
      <div class="char-info">
        <span id="char-name">あかちゃんパクモン</span> (Lv.<span id="char-lv">1</span>)
      </div>
      
      <!-- 成長メーター -->
      <div class="gauge-container">
        <div class="gauge-fill" id="gauge"></div>
      </div>

      <!-- 栄養獲得バランス -->
      <div class="nutrition-status">
        <span class="nut-badge nut-red">あか: <span id="cnt-red">0</span></span>
        <span class="nut-badge nut-yellow">きいろ: <span id="cnt-yellow">0</span></span>
        <span class="nut-badge nut-green">みどり: <span id="cnt-green">0</span></span>
      </div>
    </div>

    <!-- パズル盤面（4x4） -->
    <div class="puzzle-grid" id="grid">
      <!-- JSでブロックが生成されます -->
    </div>

    <div class="rule-tip">
      💡 <b>ルール:</b> 「あか」「きいろ」「みどり」を <b>それぞれ1つ以上</b> えらんで「たべる」を押そう！
    </div>

    <!-- コントロールボタン -->
    <div class="controls">
      <div class="score-box">てんすう: <span id="score">0</span></div>
      <button class="btn" onclick="eatSelected()">🍴 たべる！</button>
    </div>
  </div>

  <script>
    // 食材データ定義
    const FOOD_DATA = [
      { name: "にく", emoji: "🥩", group: "red" },
      { name: "さかな", emoji: "🐟", group: "red" },
      { name: "たまご", emoji: "🥚", group: "red" },
      { name: "とうふ", emoji: "🟩", group: "red" },
      { name: "ごはん", emoji: "🍚", group: "yellow" },
      { name: "パン", emoji: "🍞", group: "yellow" },
      { name: "めん", emoji: "🍜", group: "yellow" },
      { name: "いも", emoji: "🥔", group: "yellow" },
      { name: "トマト", emoji: "🍅", group: "green" },
      { name: "ぶどう", emoji: "🍇", group: "green" },
      { name: "キャベツ", emoji: "🥬", group: "green" },
      { name: "きのこ", emoji: "🍄", group: "green" }
    ];

    // キャラクター進化形態
    const EVOLUTIONS = [
      { lv: 1, name: "あかちゃんパクモン", avatar: "👶", reqScore: 0 },
      { lv: 2, name: "こどもパクモン", avatar: "👦", reqScore: 50 },
      { lv: 3, name: "おとなパクモン", avatar: "🧍", reqScore: 120 },
      { lv: 4, name: "スーパーパクモン", avatar: "🦸‍♂️", reqScore: 220 }
    ];

    let gridData = [];
    let selectedIndices = [];
    let score = 0;
    let currentLv = 1;

    let groupCounts = { red: 0, yellow: 0, green: 0 };

    // サウンド処理（Web Audio API）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'select') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'eat') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); // G5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'ng') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'levelUp') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.15);
        osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      }
    }

    // ランダムな食材生成
    function getRandomFood() {
      return FOOD_DATA[Math.floor(Math.random() * FOOD_DATA.length)];
    }

    // ボード初期化 (16マス)
    function initGrid() {
      gridData = [];
      for (let i = 0; i < 16; i++) {
        gridData.push(getRandomFood());
      }
      renderGrid();
    }

    // グリッド描画
    function renderGrid() {
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';

      gridData.forEach((food, index) => {
        const block = document.createElement('div');
        block.className = `block ${selectedIndices.includes(index) ? 'selected' : ''}`;
        
        // 色付け境界線
        if (food.group === 'red') block.style.borderColor = '#fca5a5';
        if (food.group === 'yellow') block.style.borderColor = '#fde047';
        if (food.group === 'green') block.style.borderColor = '#86efac';

        block.innerHTML = `
          <span>${food.emoji}</span>
          <span class="block-name">${food.name}</span>
        `;

        block.onclick = () => toggleSelect(index);
        gridEl.appendChild(block);
      });
    }

    // ブロック選択/解除
    function toggleSelect(index) {
      playSound('select');
      const pos = selectedIndices.indexOf(index);
      if (pos > -1) {
        selectedIndices.splice(pos, 1);
      } else {
        selectedIndices.push(index);
      }
      renderGrid();
    }

    // 「たべる」ボタン処理
    function eatSelected() {
      if (selectedIndices.length < 3) {
        playSound('ng');
        setSpeech('3つ以上の たべものを えらんでね！');
        return;
      }

      // 選択したアイテムのグループ集計
      const selectedGroups = selectedIndices.map(i => gridData[i].group);
      const hasRed = selectedGroups.includes('red');
      const hasYellow = selectedGroups.includes('yellow');
      const hasGreen = selectedGroups.includes('green');

      // 3色（赤・黄・緑）揃っているか確認
      if (hasRed && hasYellow && hasGreen) {
        playSound('eat');
        
        // 得点加算（消した個数に応じてボーナス）
        const gainedScore = selectedIndices.length * 10;
        score += gainedScore;
        document.getElementById('score').textContent = score;

        // グループカウント加算
        selectedGroups.forEach(g => groupCounts[g]++);
        document.getElementById('cnt-red').textContent = groupCounts.red;
        document.getElementById('cnt-yellow').textContent = groupCounts.yellow;
        document.getElementById('cnt-green').textContent = groupCounts.green;

        // 吹き出しメッセージ
        setSpeech(`バランスバッチリ！ +${gainedScore}てん！`);

        // キャラのアニメーション
        const avatarEl = document.getElementById('avatar');
        avatarEl.classList.add('grow');
        setTimeout(() => avatarEl.classList.remove('grow'), 300);

        // 選択されたマスを新しい食材に入れ替え
        selectedIndices.forEach(idx => {
          gridData[idx] = getRandomFood();
        });
        selectedIndices = [];

        // 成長・進化チェック
        updateGrowth();
        renderGrid();
      } else {
        // バランスが悪い場合
        playSound('ng');
        let missing = [];
        if (!hasRed) missing.push('あか');
        if (!hasYellow) missing.push('きいろ');
        if (!hasGreen) missing.push('みどり');
        setSpeech(`【${missing.join('・')}】が たりないよ！`);
      }
    }

    // セリフ変更
    function setSpeech(msg) {
      document.getElementById('speech').textContent = msg;
    }

    // 成長・進化処理
    function updateGrowth() {
      // 現在のLvでの進捗率計算
      let nextEv = EVOLUTIONS.find(e => e.lv === currentLv + 1);
      let currentEv = EVOLUTIONS.find(e => e.lv === currentLv);

      if (nextEv) {
        let progress = ((score - currentEv.reqScore) / (nextEv.reqScore - currentEv.reqScore)) * 100;
        if (progress >= 100) {
          // レベルアップ！
          currentLv++;
          playSound('levelUp');
          let newEv = EVOLUTIONS.find(e => e.lv === currentLv);
          document.getElementById('avatar').textContent = newEv.avatar;
          document.getElementById('char-name').textContent = newEv.name;
          document.getElementById('char-lv').textContent = newEv.lv;
          setSpeech(`やったー！ ${newEv.name} に しんかしたよ！ 🎉`);
          progress = 0;
        }
        document.getElementById('gauge').style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
      } else {
        // 最高レベル到達
        document.getElementById('gauge').style.width = '100%';
        setSpeech('さいこうレベル！ かんぜんたい パクモンだ！ 👑');
      }
    }

    // 初期起動
    initGrid();
  </script>
</body>
</html>
