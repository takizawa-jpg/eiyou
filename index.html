<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>おちもの！ 3しょくパクモンパズル</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background-color: #f0fdf4;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      color: #1e293b;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* 上部：キャラ＆ステータス */
    .top-section {
      width: 100%;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      border-radius: 16px;
      padding: 8px 12px;
      border: 2px solid #86efac;
      margin-bottom: 8px;
    }
    .char-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .char-avatar {
      font-size: 45px;
      transition: transform 0.2s;
    }
    .char-avatar.grow {
      transform: scale(1.3);
    }
    .char-info {
      text-align: left;
    }
    .char-name {
      font-size: 15px;
      font-weight: bold;
    }
    .score-text {
      font-size: 16px;
      font-weight: bold;
      color: #059669;
    }

    /* ゲージ */
    .gauge-bg {
      background: #cbd5e1;
      border-radius: 8px;
      height: 12px;
      width: 100%;
      margin-top: 5px;
      overflow: hidden;
    }
    .gauge-fill {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* パズル盤面 (6列×10行) */
    #board {
      display: grid;
      grid-template-columns: repeat(6, 40px);
      grid-template-rows: repeat(10, 40px);
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 12px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
    }
    .cell {
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      position: relative;
    }

    /* 枠線（グループ色） */
    .cell.group-red { border: 2px solid #ef4444; background: #450a0a; }
    .cell.group-yellow { border: 2px solid #eab308; background: #422006; }
    .cell.group-green { border: 2px solid #22c55e; background: #052e16; }

    /* 操作ボタン（iPad向け） */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 260px;
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      font-size: 22px;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: white;
      box-shadow: 0 4px #0369a1;
      cursor: pointer;
    }
    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #0369a1;
    }
    .ctrl-btn.rotate { background: #10b981; box-shadow: 0 4px #047857; }
    .ctrl-btn.down { background: #f59e0b; box-shadow: 0 4px #b45309; }

    /* ゲームオーバー表示 */
    .game-over-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      color: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="main-layout" style="position: relative;">
    
    <!-- ゲームオーバー画面 -->
    <div class="game-over-overlay" id="gameOverScreen">
      <h2>ゲームオーバー！</h2>
      <p style="font-size: 18px;">てんすう: <span id="finalScore">0</span> てん</p>
      <button class="ctrl-btn" style="width:160px;" onclick="resetGame()">もういちど！</button>
    </div>

    <!-- 上部情報 -->
    <div class="top-section">
      <div class="char-row">
        <div class="char-avatar" id="avatar">👶</div>
        <div class="char-info">
          <div class="char-name" id="charName">あかちゃんパクモン</div>
          <div class="score-text">てんすう: <span id="score">0</span></div>
        </div>
      </div>
      <div class="gauge-bg">
        <div class="gauge-fill" id="gauge"></div>
      </div>
    </div>

    <!-- パズル盤面 -->
    <div id="board"></div>

    <!-- 操作ボタン -->
    <div class="controls">
      <div class="btn-row">
        <button class="ctrl-btn" onclick="moveLeft()">◀</button>
        <button class="ctrl-btn rotate" onclick="rotatePiece()">🔄 か回転</button>
        <button class="ctrl-btn" onclick="moveRight()">▶</button>
      </div>
      <button class="ctrl-btn down" onclick="dropDown()">⬇️ はやく落とす</button>
    </div>
  </div>

  <script>
    const COLS = 6;
    const ROWS = 10;
    
    // 食材データ
    const FOODS = [
      { name: "にく", emoji: "🥩", group: "red" },
      { name: "さかな", emoji: "🐟", group: "red" },
      { name: "ごはん", emoji: "🍚", group: "yellow" },
      { name: "パン", emoji: "🍞", group: "yellow" },
      { name: "トマト", emoji: "🍅", group: "green" },
      { name: "ぶどう", emoji: "🍇", group: "green" }
    ];

    const EVOLUTIONS = [
      { lv: 1, name: "あかちゃんパクモン", avatar: "👶", reqScore: 0 },
      { lv: 2, name: "こどもパクモン", avatar: "👦", reqScore: 60 },
      { lv: 3, name: "おとなパクモン", avatar: "🧍", reqScore: 150 },
      { lv: 4, name: "スーパーパクモン", avatar: "🦸‍♂️", reqScore: 300 }
    ];

    let board = [];
    let currentPiece = null;
    let score = 0;
    let currentLv = 1;
    let gameInterval = null;
    let isGameOver = false;

    // 効果音（Web Audio API）
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'clear') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start(); osc.stop(audioCtx.currentTime + 0.35);
      } else if (type === 'move') {
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
      }
    }

    // 盤面初期化
    function initBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          boardEl.appendChild(cell);
        }
      }
    }

    // ランダムなペア生成 (2つ縦に並んだピース)
    function spawnPiece() {
      const food1 = FOODS[Math.floor(Math.random() * FOODS.length)];
      const food2 = FOODS[Math.floor(Math.random() * FOODS.length)];
      
      currentPiece = {
        x: 2,
        y: 0,
        // orientation: 0 (縦: 上が2/下が1), 1 (横: 左が1/右が2)
        dir: 0, 
        items: [food1, food2]
      };

      if (!canMove(currentPiece.x, currentPiece.y, currentPiece.dir)) {
        // 出現位置が埋まっていればゲームオーバー
        endGame();
      }
    }

    // 判定処理（重なり・画面外の検知）
    function canMove(x, y, dir) {
      const pos = getPieceCells(x, y, dir);
      return pos.every(p => {
        return p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS && !board[p.y][p.x];
      });
    }

    function getPieceCells(x, y, dir) {
      if (dir === 0) { // 縦
        return [{x: x, y: y}, {x: x, y: y - 1}];
      } else { // 横
        return [{x: x, y: y}, {x: x + 1, y: y}];
      }
    }

    // ピースの移動
    function moveLeft() {
      if (!isGameOver && canMove(currentPiece.x - 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x--;
        playSound('move');
        draw();
      }
    }
    function moveRight() {
      if (!isGameOver && canMove(currentPiece.x + 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x++;
        playSound('move');
        draw();
      }
    }
    function rotatePiece() {
      if (isGameOver) return;
      const nextDir = (currentPiece.dir === 0) ? 1 : 0;
      if (canMove(currentPiece.x, currentPiece.y, nextDir)) {
        currentPiece.dir = nextDir;
        playSound('move');
        draw();
      }
    }
    function dropDown() {
      if (isGameOver) return;
      while (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      }
      tick();
    }

    // 1ステップ進める（自動落下）
    function tick() {
      if (isGameOver) return;

      if (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      } else {
        // 着地して固定
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0) {
            board[p.y][p.x] = currentPiece.items[idx];
          }
        });

        // 浮いているブロックを下に落とす
        applyGravity();

        // 3色揃っているかチェック＆削除
        checkMatchAndClear();

        // 次のピースへ
        spawnPiece();
      }
      draw();
    }

    // 重力処理
    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (!board[r][c]) {
            for (let k = r - 1; k >= 0; k--) {
              if (board[k][c]) {
                board[r][c] = board[k][c];
                board[k][c] = null;
                break;
              }
            }
          }
        }
      }
    }

    // 3色（赤・黄・緑）揃い判定＆削除
    function checkMatchAndClear() {
      let cleared = false;
      let cellsToClear = new Set();

      // 横方向チェック (3連続の中に赤・黄・緑が含まれるか)
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 3; c++) {
          let trio = [board[r][c], board[r][c+1], board[r][c+2]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r},${c+1}`);
              cellsToClear.add(`${r},${c+2}`);
            }
          }
        }
      }

      // 縦方向チェック
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= ROWS - 3; r++) {
          let trio = [board[r][c], board[r+1][c], board[r+2][c]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r+1},${c}`);
              cellsToClear.add(`${r+2},${c}`);
            }
          }
        }
      }

      // 消去実行
      if (cellsToClear.size > 0) {
        playSound('clear');
        cleared = true;
        score += cellsToClear.size * 10;
        document.getElementById('score').textContent = score;

        cellsToClear.forEach(key => {
          let [r, c] = key.split(',').map(Number);
          board[r][c] = null;
        });

        // アニメーション＆進化チェック
        const avatarEl = document.getElementById('avatar');
        avatarEl.classList.add('grow');
        setTimeout(() => avatarEl.classList.remove('grow'), 200);

        updateEvolution();

        // 詰めた後に再度重力適用
        applyGravity();
        // 連鎖チェックのため再帰
        checkMatchAndClear();
      }
    }

    // 進化チェック
    function updateEvolution() {
      let nextEv = EVOLUTIONS.find(e => e.lv === currentLv + 1);
      let currentEv = EVOLUTIONS.find(e => e.lv === currentLv);

      if (nextEv) {
        let progress = ((score - currentEv.reqScore) / (nextEv.reqScore - currentEv.reqScore)) * 100;
        if (progress >= 100) {
          currentLv++;
          let newEv = EVOLUTIONS.find(e => e.lv === currentLv);
          document.getElementById('avatar').textContent = newEv.avatar;
          document.getElementById('charName').textContent = newEv.name;
        }
        document.getElementById('gauge').style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
      } else {
        document.getElementById('gauge').style.width = '100%';
      }
    }

    // 描画処理
    function draw() {
      // 盤面クリア描画
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.className = 'cell';
          const item = board[r][c];
          if (item) {
            cell.textContent = item.emoji;
            cell.classList.add(`group-${item.group}`);
          } else {
            cell.textContent = '';
          }
        }
      }

      // 操作中ピース描画
      if (currentPiece && !isGameOver) {
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0 && p.y < ROWS) {
            const cell = document.getElementById(`cell-${p.y}-${p.x}`);
            const item = currentPiece.items[idx];
            cell.textContent = item.emoji;
            cell.classList.add(`group-${item.group}`);
          }
        });
      }
    }

    // ゲームオーバー
    function endGame() {
      isGameOver = true;
      clearInterval(gameInterval);
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').style.display = 'flex';
    }

    // リセット
    function resetGame() {
      isGameOver = false;
      score = 0;
      currentLv = 1;
      document.getElementById('score').textContent = 0;
      document.getElementById('avatar').textContent = EVOLUTIONS[0].avatar;
      document.getElementById('charName').textContent = EVOLUTIONS[0].name;
      document.getElementById('gauge').style.width = '0%';
      document.getElementById('gameOverScreen').style.display = 'none';

      initBoard();
      spawnPiece();
      draw();

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(tick, 1000); // 1秒ごとに落とす
    }

    // キーボード操作対応（PC動作確認用）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveLeft();
      if (e.key === 'ArrowRight') moveRight();
      if (e.key === 'ArrowUp') rotatePiece();
      if (e.key === 'ArrowDown') dropDown();
    });

    // 初期起動
    resetGame();
  </script>
</body>
</html>
