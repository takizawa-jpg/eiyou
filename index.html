<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おちもの！ 3しょくパクモンパズル</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background-color: #f0fdf4;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      color: #1e293b;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
      min-height: 520px;
    }

    /* モーダルオーバーレイ（スタート・結果） */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      z-index: 999;
      padding: 20px;
      opacity: 1;
      transition: opacity 0.2s ease;
    }
    .overlay.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 26px;
      font-weight: bold;
      color: #fde047;
      margin-bottom: 12px;
    }

    .action-btn {
      font-size: 22px;
      font-weight: bold;
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 6px #047857;
      cursor: pointer;
      margin-top: 15px;
    }
    .action-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px #047857;
    }

    /* ランキング表示スタイル */
    .ranking-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 15px;
      width: 100%;
      max-width: 320px;
      margin: 12px 0;
      text-align: left;
    }
    .ranking-title {
      font-size: 16px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 8px;
      text-align: center;
    }
    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ranking-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; color: #fde047; width: 30px; }

    /* 結果画面のキャラ表示 */
    .result-char {
      font-size: 60px;
      margin: 8px 0;
    }
    .result-score {
      font-size: 22px;
      font-weight: bold;
      color: #34d399;
    }

    /* 上部：キャラ＆ステータス */
    .top-section {
      width: 100%;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      border-radius: 16px;
      padding: 8px 12px;
      border: 2px solid #86efac;
      margin-bottom: 8px;
    }
    .char-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .char-avatar {
      font-size: 45px;
      transition: transform 0.2s;
    }
    .char-avatar.grow {
      transform: scale(1.3);
    }
    .char-info {
      text-align: left;
    }
    .char-name {
      font-size: 15px;
      font-weight: bold;
    }
    .score-text {
      font-size: 16px;
      font-weight: bold;
      color: #059669;
    }

    /* ゲージ */
    .gauge-bg {
      background: #cbd5e1;
      border-radius: 8px;
      height: 12px;
      width: 100%;
      margin-top: 5px;
      overflow: hidden;
    }
    .gauge-fill {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* パズル盤面 (6列×10行) */
    #board {
      display: grid;
      grid-template-columns: repeat(6, 38px);
      grid-template-rows: repeat(10, 38px);
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 12px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
    }
    .cell {
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
    }

    /* 枠線（グループ色） */
    .cell.group-red { border: 2px solid #ef4444; background: #450a0a; }
    .cell.group-yellow { border: 2px solid #eab308; background: #422006; }
    .cell.group-green { border: 2px solid #22c55e; background: #052e16; }

    /* 操作ボタン */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 260px;
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      font-size: 20px;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: white;
      box-shadow: 0 4px #0369a1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #0369a1;
    }
    .ctrl-btn.rotate { background: #10b981; box-shadow: 0 4px #047857; }
    .ctrl-btn.down { background: #f59e0b; box-shadow: 0 4px #b45309; }
  </style>
</head>
<body>

  <div class="main-layout">
    
    <!-- スタート画面モーダル -->
    <div class="overlay" id="startScreen">
      <div class="overlay-title">3しょくパクモンパズル</div>
      <p style="font-size: 14px; margin: 0 0 10px 0;">あか・きいろ・みどり の3しょくをそろえて<br>パクモンを せいちょう させよう！</p>
      
      <!-- ランキング表示 -->
      <div class="ranking-box">
        <div class="ranking-title">🏆 ハイスコアランキング</div>
        <ol class="ranking-list" id="startRankingList">
          <!-- JSで動的生成 -->
        </ol>
      </div>

      <button class="action-btn" id="startBtn">スタート！</button>
    </div>

    <!-- リザルト（ゲーム終了）画面モーダル -->
    <div class="overlay hidden" id="resultScreen">
      <div class="overlay-title">これだけ成長したよ！</div>
      <div class="result-char" id="resultCharAvatar">👶</div>
      <div id="resultCharName" style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">あかちゃんパクモン</div>
      <div class="result-score">てんすう: <span id="finalScore">0</span> てん</div>

      <!-- ランキング表示 -->
      <div class="ranking-box">
        <div class="ranking-title">🏆 ハイスコアランキング</div>
        <ol class="ranking-list" id="resultRankingList">
          <!-- JSで動的生成 -->
        </ol>
      </div>

      <button class="action-btn" id="retryBtn">もういちど！</button>
    </div>

    <!-- 上部情報 -->
    <div class="top-section">
      <div class="char-row">
        <div class="char-avatar" id="avatar">👶</div>
        <div class="char-info">
          <div class="char-name" id="charName">あかちゃんパクモン</div>
          <div class="score-text">てんすう: <span id="score">0</span></div>
        </div>
      </div>
      <div class="gauge-bg">
        <div class="gauge-fill" id="gauge"></div>
      </div>
    </div>

    <!-- パズル盤面 -->
    <div id="board"></div>

    <!-- 操作ボタン -->
    <div class="controls">
      <div class="btn-row">
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn rotate" id="btnRotate">🔄 か回転</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
      </div>
      <button class="ctrl-btn down" id="btnDown">⬇️ はやく落とす</button>
    </div>
  </div>

  <script>
    const COLS = 6;
    const ROWS = 10;
    
    // 食材データ
    const FOODS = [
      { name: "にく", emoji: "🥩", group: "red" },
      { name: "さかな", emoji: "🐟", group: "red" },
      { name: "ごはん", emoji: "🍚", group: "yellow" },
      { name: "パン", emoji: "🍞", group: "yellow" },
      { name: "トマト", emoji: "🍅", group: "green" },
      { name: "ぶどう", emoji: "🍇", group: "green" }
    ];

    const EVOLUTIONS = [
      { lv: 1, name: "あかちゃんパクモン", avatar: "👶", reqScore: 0 },
      { lv: 2, name: "こどもパクモン", avatar: "👦", reqScore: 60 },
      { lv: 3, name: "おとなパクモン", avatar: "🧍", reqScore: 150 },
      { lv: 4, name: "スーパーパクモン", avatar: "🦸‍♂️", reqScore: 300 }
    ];

    let board = [];
    let currentPiece = null;
    let score = 0;
    let currentLv = 1;
    let gameInterval = null;
    let isGameOver = false;

    // 盤面初期化
    function initBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          boardEl.appendChild(cell);
        }
      }
    }

    // ピース生成
    function spawnPiece() {
      const food1 = FOODS[Math.floor(Math.random() * FOODS.length)];
      const food2 = FOODS[Math.floor(Math.random() * FOODS.length)];
      
      currentPiece = {
        x: 2,
        y: 1,
        dir: 0, 
        items: [food1, food2]
      };

      if (!canMove(currentPiece.x, currentPiece.y, currentPiece.dir)) {
        endGame();
      }
    }

    function canMove(x, y, dir) {
      const pos = getPieceCells(x, y, dir);
      return pos.every(p => {
        return p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS && !board[p.y][p.x];
      });
    }

    function getPieceCells(x, y, dir) {
      if (dir === 0) { // 縦
        return [{x: x, y: y}, {x: x, y: y - 1}];
      } else { // 横
        return [{x: x, y: y}, {x: x + 1, y: y}];
      }
    }

    // 移動処理
    function moveLeft() {
      if (!isGameOver && currentPiece && canMove(currentPiece.x - 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x--;
        draw();
      }
    }
    function moveRight() {
      if (!isGameOver && currentPiece && canMove(currentPiece.x + 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x++;
        draw();
      }
    }
    function rotatePiece() {
      if (isGameOver || !currentPiece) return;
      const nextDir = (currentPiece.dir === 0) ? 1 : 0;
      if (canMove(currentPiece.x, currentPiece.y, nextDir)) {
        currentPiece.dir = nextDir;
        draw();
      }
    }
    function dropDown() {
      if (isGameOver || !currentPiece) return;
      while (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      }
      tick();
    }

    // 落下処理
    function tick() {
      if (isGameOver || !currentPiece) return;

      if (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      } else {
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0 && p.y < ROWS) {
            board[p.y][p.x] = currentPiece.items[idx];
          }
        });

        applyGravity();
        checkMatchAndClear();
        if (!isGameOver) {
          spawnPiece();
        }
      }
      draw();
    }

    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (!board[r][c]) {
            for (let k = r - 1; k >= 0; k--) {
              if (board[k][c]) {
                board[r][c] = board[k][c];
                board[k][c] = null;
                break;
              }
            }
          }
        }
      }
    }

    function checkMatchAndClear() {
      let cellsToClear = new Set();

      // 横チェック
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 3; c++) {
          let trio = [board[r][c], board[r][c+1], board[r][c+2]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r},${c+1}`);
              cellsToClear.add(`${r},${c+2}`);
            }
          }
        }
      }

      // 縦チェック
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= ROWS - 3; r++) {
          let trio = [board[r][c], board[r+1][c], board[r+2][c]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r+1},${c}`);
              cellsToClear.add(`${r+2},${c}`);
            }
          }
        }
      }

      if (cellsToClear.size > 0) {
        score += cellsToClear.size * 10;
        document.getElementById('score').textContent = score;

        cellsToClear.forEach(key => {
          let [r, c] = key.split(',').map(Number);
          board[r][c] = null;
        });

        const avatarEl = document.getElementById('avatar');
        avatarEl.classList.add('grow');
        setTimeout(() => avatarEl.classList.remove('grow'), 200);

        updateEvolution();
        applyGravity();
        checkMatchAndClear();
      }
    }

    function updateEvolution() {
      let nextEv = EVOLUTIONS.find(e => e.lv === currentLv + 1);
      let currentEv = EVOLUTIONS.find(e => e.lv === currentLv);

      if (nextEv) {
        let progress = ((score - currentEv.reqScore) / (nextEv.reqScore - currentEv.reqScore)) * 100;
        if (progress >= 100) {
          currentLv++;
          let newEv = EVOLUTIONS.find(e => e.lv === currentLv);
          document.getElementById('avatar').textContent = newEv.avatar;
          document.getElementById('charName').textContent = newEv.name;
        }
        document.getElementById('gauge').style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
      } else {
        document.getElementById('gauge').style.width = '100%';
      }
    }

    function draw() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          if (!cell) continue;
          cell.className = 'cell';
          const item = board[r][c];
          if (item) {
            cell.textContent = item.emoji;
            cell.classList.add(`group-${item.group}`);
          } else {
            cell.textContent = '';
          }
        }
      }

      if (currentPiece && !isGameOver) {
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0 && p.y < ROWS) {
            const cell = document.getElementById(`cell-${p.y}-${p.x}`);
            if (cell) {
              const item = currentPiece.items[idx];
              cell.textContent = item.emoji;
              cell.classList.add(`group-${item.group}`);
            }
          }
        });
      }
    }

    /* --- ランキング機能 --- */
    function getRankings() {
      try {
        return JSON.parse(localStorage.getItem('pakumon_rankings')) || [];
      } catch (e) {
        return [];
      }
    }

    function saveScore(score, charObj) {
      let rankings = getRankings();
      rankings.push({
        score: score,
        avatar: charObj.avatar,
        name: charObj.name,
        date: new Date().toLocaleDateString('ja-JP')
      });
      rankings.sort((a, b) => b.score - a.score);
      rankings = rankings.slice(0, 5); // TOP5のみ保持
      localStorage.setItem('pakumon_rankings', JSON.stringify(rankings));
    }

    function renderRankings() {
      const rankings = getRankings();
      const startList = document.getElementById('startRankingList');
      const resultList = document.getElementById('resultRankingList');

      let html = '';
      if (rankings.length === 0) {
        html = '<li style="text-align:center; opacity: 0.7;">きろくが まだありません</li>';
      } else {
        rankings.forEach((r, idx) => {
          html += `
            <li class="ranking-item">
              <span class="rank-num">${idx + 1}い</span>
              <span>${r.avatar} ${r.name}</span>
              <span style="font-weight:bold; color:#34d399;">${r.score}pt</span>
            </li>
          `;
        });
      }
      startList.innerHTML = html;
      resultList.innerHTML = html;
    }

    /* --- ゲームオーバー・リザルト処理 --- */
    function endGame() {
      isGameOver = true;
      if (gameInterval) clearInterval(gameInterval);

      let finalChar = EVOLUTIONS.find(e => e.lv === currentLv) || EVOLUTIONS[0];

      // スコア保存
      saveScore(score, finalChar);
      renderRankings();

      // リザルト表示
      document.getElementById('finalScore').textContent = score;
      document.getElementById('resultCharAvatar').textContent = finalChar.avatar;
      document.getElementById('resultCharName').textContent = finalChar.name;

      document.getElementById('resultScreen').classList.remove('hidden');
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      resetGame();
    }

    function resetGame() {
      if (gameInterval) clearInterval(gameInterval);
      
      isGameOver = false;
      score = 0;
      currentLv = 1;
      
      document.getElementById('score').textContent = 0;
      document.getElementById('avatar').textContent = EVOLUTIONS[0].avatar;
      document.getElementById('charName').textContent = EVOLUTIONS[0].name;
      document.getElementById('gauge').style.width = '0%';

      initBoard();
      spawnPiece();
      draw();

      gameInterval = setInterval(tick, 1000);
    }

    // ボタンのイベント割り当て
    function bindButton(id, action) {
      const el = document.getElementById(id);
      if (!el) return;
      const handleEvent = (e) => {
        e.preventDefault();
        action();
      };
      el.addEventListener('touchstart', handleEvent, { passive: false });
      el.addEventListener('click', handleEvent);
    }

    bindButton('btnLeft', moveLeft);
    bindButton('btnRight', moveRight);
    bindButton('btnRotate', rotatePiece);
    bindButton('btnDown', dropDown);
    bindButton('startBtn', startGame);
    bindButton('retryBtn', startGame);

    // キーボード操作対応
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveLeft();
      if (e.key === 'ArrowRight') moveRight();
      if (e.key === 'ArrowUp') rotatePiece();
      if (e.key === 'ArrowDown') dropDown();
    });

    // 初期化時（盤面作成・ランキング表示のみ、スタートボタン待機）
    window.onload = function() {
      initBoard();
      renderRankings();
    };
  </script>
</body>
</html>
