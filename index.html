<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おちもの！ 3しょくパクモンパズル</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }
    body {
      font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", Arial, sans-serif;
      background-color: #f0fdf4;
      text-align: center;
      margin: 0;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      color: #1e293b;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 480px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
      min-height: 540px;
    }

    /* モーダルオーバーレイ（スタート・結果） */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.94);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border-radius: 20px;
      z-index: 999;
      padding: 16px 14px;
      overflow-y: auto;
    }
    .overlay.hidden {
      display: none;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 24px;
      font-weight: bold;
      color: #fde047;
      margin-bottom: 8px;
    }

    /* コース選択カード */
    .course-title {
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
      margin: 8px 0 6px 0;
    }
    .course-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 340px;
    }
    .course-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 10px;
      color: white;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }
    .course-btn.selected {
      background: rgba(16, 185, 129, 0.3);
      border-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }
    .course-icon {
      font-size: 26px;
    }
    .course-info {
      display: flex;
      flex-direction: column;
    }
    .course-name {
      font-size: 15px;
      font-weight: bold;
      color: #fde047;
    }
    .course-desc {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .action-btn {
      font-size: 20px;
      font-weight: bold;
      padding: 10px 30px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 5px #047857;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 8px;
    }
    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #047857;
    }

    /* 名前入力フォーム */
    .name-input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      width: 100%;
      max-width: 280px;
    }
    .name-input-label {
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .name-input {
      width: 100%;
      padding: 8px 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      text-align: center;
      font-weight: bold;
      outline: none;
    }

    /* ランキング表示スタイル */
    .ranking-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 12px;
      width: 100%;
      max-width: 340px;
      margin: 6px 0;
      text-align: left;
    }
    .ranking-title {
      font-size: 14px;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 6px;
      text-align: center;
    }
    .ranking-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ranking-item:last-child { border-bottom: none; }
    .rank-num { font-weight: bold; color: #fde047; width: 24px; }
    .rank-user { flex: 1; display: flex; align-items: center; gap: 4px; overflow: hidden; }
    .rank-name { font-weight: bold; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 80px; }
    .rank-char { font-size: 11px; opacity: 0.8; }
    .rank-score { font-weight: bold; color: #34d399; margin-left: 6px; }

    /* 結果画面のキャラ表示 */
    .result-char {
      font-size: 50px;
      margin: 4px 0;
    }
    .result-score {
      font-size: 20px;
      font-weight: bold;
      color: #34d399;
    }

    /* 上部：キャラ＆ステータス */
    .top-section {
      width: 100%;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      border-radius: 16px;
      padding: 8px 12px;
      border: 2px solid #86efac;
      margin-bottom: 8px;
    }
    .char-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
    }
    .char-avatar {
      font-size: 42px;
      transition: transform 0.2s;
    }
    .char-avatar.grow {
      transform: scale(1.3);
    }
    .char-info {
      text-align: left;
    }
    .char-name {
      font-size: 14px;
      font-weight: bold;
    }
    .score-text {
      font-size: 15px;
      font-weight: bold;
      color: #059669;
    }

    /* ゲージ */
    .gauge-bg {
      background: #cbd5e1;
      border-radius: 8px;
      height: 10px;
      width: 100%;
      margin-top: 5px;
      overflow: hidden;
    }
    .gauge-fill {
      background: linear-gradient(90deg, #10b981, #3b82f6);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* パズル盤面 (6列×10行) */
    #board {
      display: grid;
      grid-template-columns: repeat(6, 38px);
      grid-template-rows: repeat(10, 38px);
      gap: 2px;
      background: #334155;
      padding: 4px;
      border-radius: 12px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.2);
    }
    .cell {
      background: #0f172a;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      position: relative;
    }

    /* 枠線（グループ色） */
    .cell.group-red { border: 2px solid #ef4444; background: #450a0a; }
    .cell.group-yellow { border: 2px solid #eab308; background: #422006; }
    .cell.group-green { border: 2px solid #22c55e; background: #052e16; }

    /* 操作ボタン */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 260px;
      margin-top: 8px;
    }
    .btn-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      font-size: 20px;
      font-weight: bold;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      background: #0284c7;
      color: white;
      box-shadow: 0 4px #0369a1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #0369a1;
    }
    .ctrl-btn.rotate { background: #10b981; box-shadow: 0 4px #047857; }
    .ctrl-btn.down { background: #f59e0b; box-shadow: 0 4px #b45309; }
  </style>
</head>
<body>

  <div class="main-layout">
    
    <!-- スタート画面モーダル -->
    <div class="overlay" id="startScreen">
      <div class="overlay-title">3しょくパクモンパズル</div>
      
      <div class="course-title">せいちょうコースをえらんでね！</div>
      <div class="course-options">
        <div class="course-btn selected" onclick="selectCourse(0)" id="courseBtn0">
          <div class="course-icon">⚾</div>
          <div class="course-info">
            <div class="course-name">① スポーツせんしゅコース</div>
            <div class="course-desc">あかちゃん ➔ やきゅうぶ ➔ メジャーリーガー</div>
          </div>
        </div>
        <div class="course-btn" onclick="selectCourse(1)" id="courseBtn1">
          <div class="course-icon">🩺</div>
          <div class="course-info">
            <div class="course-name">② いしゃ・がくしゃコース</div>
            <div class="course-desc">あかちゃん ➔ ごうかく ➔ いしゃ ➔ だいがくきょうじゅ</div>
          </div>
        </div>
        <div class="course-btn" onclick="selectCourse(2)" id="courseBtn2">
          <div class="course-icon">🌟</div>
          <div class="course-info">
            <div class="course-name">③ げいのうコース</div>
            <div class="course-desc">あかちゃん ➔ モデル ➔ げいのうじん ➔ はいゆう</div>
          </div>
        </div>
      </div>

      <button class="action-btn" id="startBtn">スタート！</button>

      <!-- ランキング表示 -->
      <div class="ranking-box">
        <div class="ranking-title">🏆 スコアランキング</div>
        <ol class="ranking-list" id="startRankingList"></ol>
      </div>
    </div>

    <!-- リザルト（ゲーム終了）画面モーダル -->
    <div class="overlay hidden" id="resultScreen">
      <div class="overlay-title">これだけ成長したよ！</div>
      <div class="result-char" id="resultCharAvatar">👶</div>
      <div id="resultCharName" style="font-size: 16px; font-weight: bold;">あかちゃん</div>
      <div class="result-score">てんすう: <span id="finalScore">0</span> てん</div>

      <!-- 名前入力フォーム -->
      <div class="name-input-group">
        <label class="name-input-label" for="playerName">なまえを 入力して ランキングに とうろく！</label>
        <input type="text" id="playerName" class="name-input" placeholder="なまえ" maxlength="8">
      </div>

      <button class="action-btn" id="saveAndRetryBtn">とうろくして もういちど！</button>

      <!-- ランキング表示 -->
      <div class="ranking-box">
        <div class="ranking-title">🏆 スコアランキング</div>
        <ol class="ranking-list" id="resultRankingList"></ol>
      </div>
    </div>

    <!-- 上部情報 -->
    <div class="top-section">
      <div class="char-row">
        <div class="char-avatar" id="avatar">👶</div>
        <div class="char-info">
          <div class="char-name" id="charName">あかちゃん</div>
          <div class="score-text">てんすう: <span id="score">0</span></div>
        </div>
      </div>
      <div class="gauge-bg">
        <div class="gauge-fill" id="gauge"></div>
      </div>
    </div>

    <!-- パズル盤面 -->
    <div id="board"></div>

    <!-- 操作ボタン -->
    <div class="controls">
      <div class="btn-row">
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn rotate" id="btnRotate">🔄 か回転</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
      </div>
      <button class="ctrl-btn down" id="btnDown">⬇️ はやく落とす</button>
    </div>
  </div>

  <script>
    const COLS = 6;
    const ROWS = 10;
    
    // 食材データ
    const FOODS = [
      { name: "にく", emoji: "🥩", group: "red" },
      { name: "さかな", emoji: "🐟", group: "red" },
      { name: "ごはん", emoji: "🍚", group: "yellow" },
      { name: "パン", emoji: "🍞", group: "yellow" },
      { name: "トマト", emoji: "🍅", group: "green" },
      { name: "ぶどう", emoji: "🍇", group: "green" }
    ];

    // 3つの成長コース定義
    const COURSES = [
      {
        id: "sports",
        title: "スポーツ選手コース",
        evolutions: [
          { lv: 1, name: "赤ちゃん", avatar: "👶", reqScore: 0 },
          { lv: 2, name: "幼児", avatar: "🧒", reqScore: 40 },
          { lv: 3, name: "小学生", avatar: "👦", reqScore: 90 },
          { lv: 4, name: "野球部", avatar: "⚾", reqScore: 150 },
          { lv: 5, name: "甲子園出場", avatar: "🏆", reqScore: 220 },
          { lv: 6, name: "大学野球選手", avatar: "🏃‍♂️", reqScore: 300 },
          { lv: 7, name: "プロ野球選手", avatar: "🧢", reqScore: 400 },
          { lv: 8, name: "メジャーリーガー", avatar: "🌟", reqScore: 520 }
        ]
      },
      {
        id: "doctor",
        title: "医者・学者コース",
        evolutions: [
          { lv: 1, name: "赤ちゃん", avatar: "👶", reqScore: 0 },
          { lv: 2, name: "幼児", avatar: "🧒", reqScore: 40 },
          { lv: 3, name: "小学生", avatar: "👦", reqScore: 90 },
          { lv: 4, name: "中学受験合格", avatar: "🎒", reqScore: 150 },
          { lv: 5, name: "高校受験合格", avatar: "✏️", reqScore: 220 },
          { lv: 6, name: "大学医学部合格", avatar: "🎓", reqScore: 300 },
          { lv: 7, name: "医者", avatar: "🩺", reqScore: 400 },
          { lv: 8, name: "大学教授", avatar: "👨‍🏫", reqScore: 520 }
        ]
      },
      {
        id: "entertainment",
        title: "芸能コース",
        evolutions: [
          { lv: 1, name: "赤ちゃん", avatar: "👶", reqScore: 0 },
          { lv: 2, name: "幼児", avatar: "🧒", reqScore: 40 },
          { lv: 3, name: "小学生", avatar: "👧", reqScore: 90 },
          { lv: 4, name: "研修生", avatar: "🎤", reqScore: 150 },
          { lv: 5, name: "高校生モデル", avatar: "📸", reqScore: 220 },
          { lv: 6, name: "インフルエンサー", avatar: "📱", reqScore: 300 },
          { lv: 7, name: "芸能人", avatar: "✨", reqScore: 400 },
          { lv: 8, name: "売れっ子俳優", avatar: "🎬", reqScore: 520 }
        ]
      }
    ];

    let selectedCourseIdx = 0;
    let board = [];
    let currentPiece = null;
    let score = 0;
    let currentLv = 1;
    let gameInterval = null;
    let isGameOver = false;

    function selectCourse(idx) {
      selectedCourseIdx = idx;
      for (let i = 0; i < 3; i++) {
        const btn = document.getElementById(`courseBtn${i}`);
        if (i === idx) {
          btn.classList.add('selected');
        } else {
          btn.classList.remove('selected');
        }
      }
    }

    // 盤面初期化
    function initBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          boardEl.appendChild(cell);
        }
      }
    }

    // ピース生成
    function spawnPiece() {
      const food1 = FOODS[Math.floor(Math.random() * FOODS.length)];
      const food2 = FOODS[Math.floor(Math.random() * FOODS.length)];
      
      currentPiece = {
        x: 2,
        y: 1,
        dir: 0, 
        items: [food1, food2]
      };

      if (!canMove(currentPiece.x, currentPiece.y, currentPiece.dir)) {
        endGame();
      }
    }

    function canMove(x, y, dir) {
      const pos = getPieceCells(x, y, dir);
      return pos.every(p => {
        return p.x >= 0 && p.x < COLS && p.y >= 0 && p.y < ROWS && !board[p.y][p.x];
      });
    }

    function getPieceCells(x, y, dir) {
      if (dir === 0) { // 縦
        return [{x: x, y: y}, {x: x, y: y - 1}];
      } else { // 横
        return [{x: x, y: y}, {x: x + 1, y: y}];
      }
    }

    // 移動処理
    function moveLeft() {
      if (!isGameOver && currentPiece && canMove(currentPiece.x - 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x--;
        draw();
      }
    }
    function moveRight() {
      if (!isGameOver && currentPiece && canMove(currentPiece.x + 1, currentPiece.y, currentPiece.dir)) {
        currentPiece.x++;
        draw();
      }
    }
    function rotatePiece() {
      if (isGameOver || !currentPiece) return;
      const nextDir = (currentPiece.dir === 0) ? 1 : 0;
      if (canMove(currentPiece.x, currentPiece.y, nextDir)) {
        currentPiece.dir = nextDir;
        draw();
      }
    }
    function dropDown() {
      if (isGameOver || !currentPiece) return;
      while (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      }
      tick();
    }

    // 落下処理
    function tick() {
      if (isGameOver || !currentPiece) return;

      if (canMove(currentPiece.x, currentPiece.y + 1, currentPiece.dir)) {
        currentPiece.y++;
      } else {
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0 && p.y < ROWS) {
            board[p.y][p.x] = currentPiece.items[idx];
          }
        });

        applyGravity();
        checkMatchAndClear();
        if (!isGameOver) {
          spawnPiece();
        }
      }
      draw();
    }

    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (!board[r][c]) {
            for (let k = r - 1; k >= 0; k--) {
              if (board[k][c]) {
                board[r][c] = board[k][c];
                board[k][c] = null;
                break;
              }
            }
          }
        }
      }
    }

    function checkMatchAndClear() {
      let cellsToClear = new Set();

      // 横チェック
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 3; c++) {
          let trio = [board[r][c], board[r][c+1], board[r][c+2]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r},${c+1}`);
              cellsToClear.add(`${r},${c+2}`);
            }
          }
        }
      }

      // 縦チェック
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= ROWS - 3; r++) {
          let trio = [board[r][c], board[r+1][c], board[r+2][c]];
          if (trio.every(item => item !== null)) {
            let groups = trio.map(i => i.group);
            if (groups.includes('red') && groups.includes('yellow') && groups.includes('green')) {
              cellsToClear.add(`${r},${c}`);
              cellsToClear.add(`${r+1},${c}`);
              cellsToClear.add(`${r+2},${c}`);
            }
          }
        }
      }

      if (cellsToClear.size > 0) {
        score += cellsToClear.size * 10;
        document.getElementById('score').textContent = score;

        cellsToClear.forEach(key => {
          let [r, c] = key.split(',').map(Number);
          board[r][c] = null;
        });

        const avatarEl = document.getElementById('avatar');
        avatarEl.classList.add('grow');
        setTimeout(() => avatarEl.classList.remove('grow'), 200);

        updateEvolution();
        applyGravity();
        checkMatchAndClear();
      }
    }

    function updateEvolution() {
      const evolutions = COURSES[selectedCourseIdx].evolutions;
      let nextEv = evolutions.find(e => e.lv === currentLv + 1);
      let currentEv = evolutions.find(e => e.lv === currentLv);

      if (nextEv) {
        let progress = ((score - currentEv.reqScore) / (nextEv.reqScore - currentEv.reqScore)) * 100;
        if (progress >= 100) {
          currentLv++;
          let newEv = evolutions.find(e => e.lv === currentLv);
          document.getElementById('avatar').textContent = newEv.avatar;
          document.getElementById('charName').textContent = newEv.name;
        }
        document.getElementById('gauge').style.width = `${Math.min(Math.max(progress, 0), 100)}%`;
      } else {
        document.getElementById('gauge').style.width = '100%';
      }
    }

    function draw() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          if (!cell) continue;
          cell.className = 'cell';
          const item = board[r][c];
          if (item) {
            cell.textContent = item.emoji;
            cell.classList.add(`group-${item.group}`);
          } else {
            cell.textContent = '';
          }
        }
      }

      if (currentPiece && !isGameOver) {
        const cells = getPieceCells(currentPiece.x, currentPiece.y, currentPiece.dir);
        cells.forEach((p, idx) => {
          if (p.y >= 0 && p.y < ROWS) {
            const cell = document.getElementById(`cell-${p.y}-${p.x}`);
            if (cell) {
              const item = currentPiece.items[idx];
              cell.textContent = item.emoji;
              cell.classList.add(`group-${item.group}`);
            }
          }
        });
      }
    }

    /* --- ランキング機能 --- */
    function getRankings() {
      try {
        return JSON.parse(localStorage.getItem('pakumon_v2_rankings')) || [];
      } catch (e) {
        return [];
      }
    }

    function saveScore(userName, finalScore, charObj) {
      if (!userName || userName.trim() === '') {
        userName = 'ななし';
      }
      let rankings = getRankings();
      rankings.push({
        name: userName.trim(),
        score: finalScore,
        avatar: charObj.avatar,
        charName: charObj.name
      });
      rankings.sort((a, b) => b.score - a.score);
      rankings = rankings.slice(0, 5); // TOP5保存
      localStorage.setItem('pakumon_v2_rankings', JSON.stringify(rankings));
    }

    function renderRankings() {
      const rankings = getRankings();
      const startList = document.getElementById('startRankingList');
      const resultList = document.getElementById('resultRankingList');

      let html = '';
      if (rankings.length === 0) {
        html = '<li style="text-align:center; opacity: 0.7;">きろくが まだありません</li>';
      } else {
        rankings.forEach((r, idx) => {
          html += `
            <li class="ranking-item">
              <span class="rank-num">${idx + 1}位</span>
              <div class="rank-user">
                <span class="rank-name">${r.name}</span>
                <span class="rank-char">(${r.avatar}${r.charName})</span>
              </div>
              <span class="rank-score">${r.score}pt</span>
            </li>
          `;
        });
      }
      startList.innerHTML = html;
      resultList.innerHTML = html;
    }

    /* --- ゲームオーバー・リザルト処理 --- */
    function endGame() {
      isGameOver = true;
      if (gameInterval) clearInterval(gameInterval);

      const evolutions = COURSES[selectedCourseIdx].evolutions;
      let finalChar = evolutions.find(e => e.lv === currentLv) || evolutions[0];

      // リザルト画面更新
      document.getElementById('finalScore').textContent = score;
      document.getElementById('resultCharAvatar').textContent = finalChar.avatar;
      document.getElementById('resultCharName').textContent = finalChar.name;

      renderRankings();
      document.getElementById('resultScreen').classList.remove('hidden');
    }

    function handleSaveAndRetry() {
      const nameInput = document.getElementById('playerName');
      const evolutions = COURSES[selectedCourseIdx].evolutions;
      let finalChar = evolutions.find(e => e.lv === currentLv) || evolutions[0];

      saveScore(nameInput.value, score, finalChar);
      nameInput.value = '';

      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
      renderRankings();
    }

    function startGame() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      resetGame();
    }

    function resetGame() {
      if (gameInterval) clearInterval(gameInterval);
      
      isGameOver = false;
      score = 0;
      currentLv = 1;
      
      const initialChar = COURSES[selectedCourseIdx].evolutions[0];
      document.getElementById('score').textContent = 0;
      document.getElementById('avatar').textContent = initialChar.avatar;
      document.getElementById('charName').textContent = initialChar.name;
      document.getElementById('gauge').style.width = '0%';

      initBoard();
      spawnPiece();
      draw();

      gameInterval = setInterval(tick, 1000);
    }

    // イベントバインド
    function bindButton(id, action) {
      const el = document.getElementById(id);
      if (!el) return;
      const handleEvent = (e) => {
        e.preventDefault();
        action();
      };
      el.addEventListener('touchstart', handleEvent, { passive: false });
      el.addEventListener('click', handleEvent);
    }

    bindButton('btnLeft', moveLeft);
    bindButton('btnRight', moveRight);
    bindButton('btnRotate', rotatePiece);
    bindButton('btnDown', dropDown);
    bindButton('startBtn', startGame);
    bindButton('saveAndRetryBtn', handleSaveAndRetry);

    // キーボード操作
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveLeft();
      if (e.key === 'ArrowRight') moveRight();
      if (e.key === 'ArrowUp') rotatePiece();
      if (e.key === 'ArrowDown') dropDown();
    });

    // 初期起動
    window.onload = function() {
      initBoard();
      renderRankings();
    };
  </script>
</body>
</html>
