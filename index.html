<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>おちもの！ 3しょくパクモンパズル</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fef3c7 0%, #e0f2fe 50%, #fbcfe8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 8px;
      color: #1e293b;
      overflow-x: hidden;
    }

    /* Main Container Card */
    .game-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 4px solid #f59e0b;
      border-radius: 24px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
      padding: 12px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Header & Evolution Area */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fffbe3;
      border: 3px solid #fcd34d;
      border-radius: 16px;
      padding: 8px 12px;
    }

    .character-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      font-size: 2.4rem;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .char-info {
      display: flex;
      flex-direction: column;
    }

    .char-name {
      font-weight: 900;
      font-size: 0.95rem;
      color: #d97706;
    }

    .score-badge {
      font-size: 1.1rem;
      font-weight: 900;
      color: #059669;
    }

    /* Evolution Gauge */
    .gauge-container {
      width: 100%;
      background: #e2e8f0;
      border-radius: 12px;
      height: 14px;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444);
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    /* Puzzle Grid Layout */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(10, 1fr);
      gap: 4px;
      background: #334155;
      padding: 6px;
      border-radius: 16px;
      border: 4px solid #1e293b;
      aspect-ratio: 6 / 10;
      width: 100%;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.3);
    }

    .cell {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: background-color 0.1s;
    }

    /* Color Group Styling for Blocks */
    .cell.group-red {
      background: #fca5a5;
      border: 2px solid #ef4444;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
    }

    .cell.group-yellow {
      background: #fef08a;
      border: 2px solid #eab308;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
    }

    .cell.group-green {
      background: #86efac;
      border: 2px solid #22c55e;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.6);
    }

    /* Highlight matching animation */
    @keyframes pop-animation {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
      100% { transform: scale(0); opacity: 0; }
    }
    .cell.clearing {
      animation: pop-animation 0.25s forwards;
    }

    /* Mobile Controls Bar */
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 4px;
    }

    .btn-ctrl {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      font-weight: 900;
      font-size: 1.2rem;
      padding: 12px 0;
      border: none;
      border-bottom: 4px solid #0369a1;
      border-radius: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .btn-ctrl:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      box-shadow: none;
    }

    .btn-ctrl span {
      font-size: 0.65rem;
      font-weight: 800;
    }

    /* Game Over Modal Styling - CRITICAL FIX FOR STUCK BUG */
    #gameOverScreen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-in-out;
    }

    #gameOverScreen.active {
      display: flex !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    .go-title {
      font-size: 2rem;
      font-weight: 900;
      color: #f87171;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    .go-score {
      font-size: 1.2rem;
      margin-bottom: 20px;
      background: rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-restart {
      background: linear-gradient(180deg, #10b981 0%, #047857 100%);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 900;
      padding: 14px 28px;
      border: none;
      border-bottom: 5px solid #065f46;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.1s, background-color 0.1s;
    }

    .btn-restart:active {
      transform: scale(0.96);
      border-bottom-width: 2px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    
    <!-- Header: Avatar, Name & Score -->
    <div class="header">
      <div class="character-box">
        <div id="charAvatar" class="avatar">👶</div>
        <div class="char-info">
          <div id="charName" class="char-name">あかちゃんパクモン</div>
          <div class="score-badge"><span id="scoreVal">0</span> 点</div>
        </div>
      </div>
    </div>

    <!-- Evolution Progress Bar -->
    <div class="gauge-container">
      <div id="gaugeFill" class="gauge-fill"></div>
    </div>

    <!-- 6x10 Puzzle Grid -->
    <div id="gridBoard" class="grid-board"></div>

    <!-- Mobile Touch Controls -->
    <div class="controls">
      <button id="btnLeft" class="btn-ctrl">⬅️<span>ひだり</span></button>
      <button id="btnRotate" class="btn-ctrl">🔄<span>か回転</span></button>
      <button id="btnRight" class="btn-ctrl">➡️<span>みぎ</span></button>
      <button id="btnDrop" class="btn-ctrl" style="background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); border-color: #b45309;">
        ⬇️<span>落とす</span>
      </button>
    </div>

    <!-- Game Over Screen Modal (safely hidden by default) -->
    <div id="gameOverScreen">
      <div class="go-title">ゲームオーバー</div>
      <div class="go-score">スコア: <span id="finalScore">0</span> 点</div>
      <button id="btnRestart" class="btn-restart">🔄 もういちど！</button>
    </div>

  </div>

  <script>
    const COLS = 6;
    const ROWS = 10;

    // 3 Food Color Groups
    const FOODS = [
      { emoji: '🥩', group: 'red', name: 'にく' },
      { emoji: '🐟', group: 'red', name: 'さかな' },
      { emoji: '🍚', group: 'yellow', name: 'ごはん' },
      { emoji: '🍞', group: 'yellow', name: 'パン' },
      { emoji: '🍅', group: 'green', name: 'トマト' },
      { emoji: '🍇', group: 'green', name: 'ぶどう' }
    ];

    // Character Evolution Milestones
    const EVOLUTIONS = [
      { name: 'あかちゃんパクモン', avatar: '👶', minScore: 0, nextScore: 60 },
      { name: 'こどもパクモン', avatar: '👦', minScore: 60, nextScore: 150 },
      { name: 'おとなパクモン', avatar: '🧍', minScore: 150, nextScore: 300 },
      { name: 'スーパーパクモン', avatar: '🦸‍♂️', minScore: 300, nextScore: 9999 }
    ];

    // Game Logic State Variables
    let grid = [];
    let currentPiece = null; // { x, y, rot, blocks: [block1, block2] }
    let gameInterval = null;
    let isGameOver = false;
    let isProcessingMatch = false;
    let score = 0;

    // DOM Elements
    const gridBoardEl = document.getElementById('gridBoard');
    const scoreValEl = document.getElementById('scoreVal');
    const charAvatarEl = document.getElementById('charAvatar');
    const charNameEl = document.getElementById('charName');
    const gaugeFillEl = document.getElementById('gaugeFill');
    const gameOverScreenEl = document.getElementById('gameOverScreen');
    const finalScoreEl = document.getElementById('finalScore');
    const btnRestartEl = document.getElementById('btnRestart');

    // Initialize blank grid array
    function createEmptyGrid() {
      grid = [];
      for (let r = 0; r < ROWS; r++) {
        const row = [];
        for (let c = 0; c < COLS; c++) {
          row.push(null);
        }
        grid.push(row);
      }
    }

    // Generate DOM Cells
    function initDOMGrid() {
      gridBoardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          gridBoardEl.appendChild(cell);
        }
      }
    }

    // Render Grid & Active Piece
    function draw() {
      // Clear static DOM styles
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.className = 'cell';
          cell.textContent = '';
          const data = grid[r][c];
          if (data) {
            cell.textContent = data.emoji;
            cell.classList.add(`group-${data.group}`);
          }
        }
      }

      // Draw current falling piece
      if (currentPiece && !isGameOver) {
        const coords = getPieceCoords(currentPiece);
        coords.forEach((pos, idx) => {
          if (pos.r >= 0 && pos.r < ROWS && pos.c >= 0 && pos.c < COLS) {
            const cell = document.getElementById(`cell-${pos.r}-${pos.c}`);
            if (cell) {
              const block = currentPiece.blocks[idx];
              cell.textContent = block.emoji;
              cell.classList.add(`group-${block.group}`);
            }
          }
        });
      }
    }

    // Get absolute coordinates for 2-block piece based on rotation (0: top-bottom, 1: left-right, 2: bottom-top, 3: right-left)
    function getPieceCoords(piece) {
      const { x, y, rot } = piece;
      let secondC = x;
      let secondR = y - 1; // default vertical above

      if (rot === 1) { secondC = x + 1; secondR = y; }
      else if (rot === 2) { secondC = x; secondR = y + 1; }
      else if (rot === 3) { secondC = x - 1; secondR = y; }

      return [
        { r: y, c: x },
        { r: secondR, c: secondC }
      ];
    }

    function getRandomFood() {
      return FOODS[Math.floor(Math.random() * FOODS.length)];
    }

    function spawnPiece() {
      const b1 = getRandomFood();
      const b2 = getRandomFood();

      // Start at top center
      currentPiece = {
        x: 2,
        y: 1, // Row index 1 allows second block above at Row 0
        rot: 0,
        blocks: [b1, b2]
      };

      // Check immediate collision at spawn -> Game Over
      if (!isValidPosition(currentPiece)) {
        triggerGameOver();
      }
    }

    function isValidPosition(piece) {
      const coords = getPieceCoords(piece);
      for (let pos of coords) {
        if (pos.c < 0 || pos.c >= COLS || pos.r < 0 || pos.r >= ROWS) {
          return false;
        }
        if (grid[pos.r][pos.c] !== null) {
          return false;
        }
      }
      return true;
    }

    function moveLeft() {
      if (!currentPiece || isProcessingMatch || isGameOver) return;
      const test = { ...currentPiece, x: currentPiece.x - 1 };
      if (isValidPosition(test)) {
        currentPiece.x--;
        draw();
      }
    }

    function moveRight() {
      if (!currentPiece || isProcessingMatch || isGameOver) return;
      const test = { ...currentPiece, x: currentPiece.x + 1 };
      if (isValidPosition(test)) {
        currentPiece.x++;
        draw();
      }
    }

    function rotatePiece() {
      if (!currentPiece || isProcessingMatch || isGameOver) return;
      const test = { ...currentPiece, rot: (currentPiece.rot + 1) % 4 };
      if (isValidPosition(test)) {
        currentPiece.rot = test.rot;
        draw();
      }
    }

    function dropStep() {
      if (!currentPiece || isProcessingMatch || isGameOver) return;
      const test = { ...currentPiece, y: currentPiece.y + 1 };
      if (isValidPosition(test)) {
        currentPiece.y++;
        draw();
      } else {
        lockPiece();
      }
    }

    function hardDrop() {
      if (!currentPiece || isProcessingMatch || isGameOver) return;
      while (true) {
        const test = { ...currentPiece, y: currentPiece.y + 1 };
        if (isValidPosition(test)) {
          currentPiece.y++;
        } else {
          break;
        }
      }
      draw();
      lockPiece();
    }

    function lockPiece() {
      const coords = getPieceCoords(currentPiece);
      coords.forEach((pos, idx) => {
        if (pos.r >= 0 && pos.r < ROWS && pos.c >= 0 && pos.c < COLS) {
          grid[pos.r][pos.c] = currentPiece.blocks[idx];
        }
      });
      currentPiece = null;
      draw();

      processBoardMatches();
    }

    // Match 3-contiguous blocks containing Red, Yellow AND Green
    async function processBoardMatches() {
      isProcessingMatch = true;
      let matched = false;

      do {
        matched = false;
        let toClear = new Set();

        // 1. Horizontal check
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c <= COLS - 3; c++) {
            const b1 = grid[r][c];
            const b2 = grid[r][c+1];
            const b3 = grid[r][c+2];
            if (b1 && b2 && b3) {
              const groups = new Set([b1.group, b2.group, b3.group]);
              if (groups.has('red') && groups.has('yellow') && groups.has('green')) {
                toClear.add(`${r},${c}`);
                toClear.add(`${r},${c+1}`);
                toClear.add(`${r},${c+2}`);
              }
            }
          }
        }

        // 2. Vertical check
        for (let c = 0; c < COLS; c++) {
          for (let r = 0; r <= ROWS - 3; r++) {
            const b1 = grid[r][c];
            const b2 = grid[r+1][c];
            const b3 = grid[r+2][c];
            if (b1 && b2 && b3) {
              const groups = new Set([b1.group, b2.group, b3.group]);
              if (groups.has('red') && groups.has('yellow') && groups.has('green')) {
                toClear.add(`${r},${c}`);
                toClear.add(`${r+1},${c}`);
                toClear.add(`${r+2},${c}`);
              }
            }
          }
        }

        // Apply clears & add points
        if (toClear.size > 0) {
          matched = true;
          score += toClear.size * 10;
          updateUI();

          // Highlight clearing cells
          toClear.forEach(coord => {
            const [r, c] = coord.split(',').map(Number);
            const cell = document.getElementById(`cell-${r}-${c}`);
            if (cell) cell.classList.add('clearing');
          });

          await new Promise(res => setTimeout(res, 250));

          // Clear array slots
          toClear.forEach(coord => {
            const [r, c] = coord.split(',').map(Number);
            grid[r][c] = null;
          });

          // Apply Gravity Drop
          applyGravity();
          draw();
          await new Promise(res => setTimeout(res, 200));
        }

      } while (matched);

      isProcessingMatch = false;

      if (!isGameOver) {
        spawnPiece();
        draw();
      }
    }

    function applyGravity() {
      for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r][c] === null) {
            for (let look = r - 1; look >= 0; look--) {
              if (grid[look][c] !== null) {
                grid[r][c] = grid[look][c];
                grid[look][c] = null;
                break;
              }
            }
          }
        }
      }
    }

    function updateUI() {
      scoreValEl.textContent = score;

      // Calculate evolution level
      let currentEvo = EVOLUTIONS[0];
      for (let evo of EVOLUTIONS) {
        if (score >= evo.minScore) {
          currentEvo = evo;
        }
      }

      charAvatarEl.textContent = currentEvo.avatar;
      charNameEl.textContent = currentEvo.name;

      // Update Gauge
      const currentMin = currentEvo.minScore;
      const currentNext = currentEvo.nextScore;
      let progress = 100;
      if (currentNext < 9999) {
        progress = Math.min(100, Math.max(0, ((score - currentMin) / (currentNext - currentMin)) * 100));
      }
      gaugeFillEl.style.width = `${progress}%`;
    }

    function triggerGameOver() {
      isGameOver = true;
      if (gameInterval) clearInterval(gameInterval);

      finalScoreEl.textContent = score;
      gameOverScreenEl.classList.add('active');
    }

    // CRITICAL RESET FUNCTION - Solves "Stuck on Game Over / Restart" issue cleanly
    function resetGame() {
      // 1. Safely halt game loops
      if (gameInterval) {
        clearInterval(gameInterval);
        gameInterval = null;
      }

      // 2. Reset flags & state
      isGameOver = false;
      isProcessingMatch = false;
      score = 0;
      currentPiece = null;

      // 3. Hide game over screen completely
      gameOverScreenEl.classList.remove('active');

      // 4. Re-initialize board data & DOM
      createEmptyGrid();
      initDOMGrid();
      updateUI();

      // 5. Spawn starting block & launch tick interval
      spawnPiece();
      draw();

      gameInterval = setInterval(() => {
        if (!isGameOver && !isProcessingMatch) {
          dropStep();
        }
      }, 750);
    }

    function bindControlEvents() {
      const bindBtn = (id, fn) => {
        const el = document.getElementById(id);
        if (!el) return;
        
        const handler = (e) => {
          e.preventDefault();
          fn();
        };

        el.addEventListener('pointerdown', handler);
      };

      bindBtn('btnLeft', moveLeft);
      bindBtn('btnRight', moveRight);
      bindBtn('btnRotate', rotatePiece);
      bindBtn('btnDrop', hardDrop);

      // Dedicated robust binding for Restart button (prevents Safari pointer/touch drops)
      const handleRestart = (e) => {
        e.preventDefault();
        e.stopPropagation();
        resetGame();
      };

      btnRestartEl.addEventListener('pointerdown', handleRestart);
      btnRestartEl.addEventListener('click', handleRestart);

      // Keyboard Controls Fallback
      window.addEventListener('keydown', (e) => {
        if (isGameOver) {
          if (e.key === 'Enter' || e.key === ' ') {
            resetGame();
          }
          return;
        }

        switch (e.key) {
          case 'ArrowLeft':
            moveLeft();
            break;
          case 'ArrowRight':
            moveRight();
            break;
          case 'ArrowUp':
            rotatePiece();
            break;
          case 'ArrowDown':
            dropStep();
            break;
          case ' ':
            hardDrop();
            break;
        }
      });
    }

    window.addEventListener('load', () => {
      bindControlEvents();
      resetGame();
    });
  </script>
</body>
</html>
